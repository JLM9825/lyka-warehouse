<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b12"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>LYKA Warehouse</title><style>
*{box-sizing:border-box}body{margin:0;background:#050e09;color:#e7f8ed;font:15px system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #296143;background:#102d20;color:#e7f8ed;border-radius:9px;padding:12px;min-height:44px}button:hover,button.active{border-color:#40ef89;background:#174c30}button.primary{background:#45ed85;color:#052414;font-weight:800}aside{position:fixed;inset:0 auto 0 0;width:205px;background:#081b12;border-right:1px solid #244c35;padding:22px 12px}aside h1{color:#45ed85;font-size:32px;margin:0}aside small{letter-spacing:3px}nav{display:grid;gap:10px;margin-top:36px}nav button{text-align:left}main{margin-left:205px;padding:26px;max-width:1800px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1,h2,h3,p{margin-top:0}h2{font-size:27px;margin-bottom:7px}small,label,.muted{color:#9ab9a5}label{display:grid;gap:6px;font-size:13px}input,textarea,select{width:100%;background:#06140d;border:1px solid #28543b;color:#e7f8ed;padding:12px;border-radius:8px;min-width:0}textarea{min-height:120px;resize:vertical} .panel,.metric{background:linear-gradient(140deg,#102a1c,#091b12);border:1px solid #28543b;border-radius:14px;padding:18px;margin-bottom:16px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric strong{display:block;color:#45ed85;font-size:25px;margin-top:8px}.split{display:grid;grid-template-columns:minmax(310px,1fr) minmax(0,1.1fr);gap:16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #284534}th{color:#9ab9a5} .doc{background:white;color:#17251d;padding:24px;margin:12px auto;max-width:794px;min-height:500px;font-size:11px;overflow-wrap:anywhere}.doc h3{color:#063d23}.doc table{font-size:10px}.doc th,.doc td{border:1px solid #bbb;padding:5px;color:#17251d}.doc .logo{float:right;color:#063d23;font-size:24px;font-style:italic;font-weight:900}.doc pre{white-space:pre-wrap;font:inherit}.bar{height:14px;background:#45ed85;border-radius:4px;min-width:2px}.warning{color:#ffd58a}.hidden{display:none!important}@media(max-width:1050px){aside{width:155px}main{margin-left:155px;padding:16px}.split{grid-template-columns:1fr}.metrics{gap:8px}.metric{padding:12px}}@media(max-width:650px){aside{position:static;width:auto;padding:12px}nav{display:flex;overflow:auto;margin-top:12px}nav button{white-space:nowrap}main{margin:0;padding:12px}.fields{grid-template-columns:1fr}.metric strong{font-size:18px}}@media print{@page{size:A4;margin:12mm}body{background:white}body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;inset:0;margin:0}.doc{margin:0;padding:0;max-width:none;min-height:0;break-after:page}.doc:last-child{break-after:auto}.doc tr{break-inside:avoid}}
</style></head><body><aside><h1>LYKA</h1><small>WAREHOUSE</small><nav id="nav"></nav><p class="warning" style="margin-top:30px;font-size:12px">Local prototype · not secured</p></aside><main><header><div><h2 id="title"></h2><p class="muted" id="subtitle"></p></div><small id="clock"></small></header><section id="dashboard"></section><section id="receiving" hidden><div class="split"><div><div class="panel"><h3>Delivery information</h3><div class="fields" id="fields"></div></div><div class="panel"><h3>Product breakdown</h3><small>Accepted delimiter: <b>– (hyphen)</b></small><label>Raw breakdown stream<textarea id="raw" placeholder="Kangaroo trim&#10;952-979.2-979.2"></textarea></label><label>Additional notes / instructions<textarea id="notes" placeholder="Kangaroo trim BBD: 30/06/2028"></textarea></label><div class="actions"><button onclick="sample()">Load sample</button><button onclick="clearForm()">Clear</button><button onclick="copyInput()">Copy input</button></div><p id="errors" class="warning"></p></div></div><div><div id="live"></div><div class="panel"><h3>Receiving docket preview</h3><div class="actions"><button class="primary" onclick="save()">Generate & save record</button><button onclick="printCurrent()">Print / Save PDF</button></div><div id="preview"></div></div></div></div></section><section id="history" hidden></section><section id="records" hidden></section><section id="settings" hidden><div class="panel"><h3>Prototype settings</h3><p>Records are stored only in this browser. No staff authentication or shared database is configured. Use sample data only.</p><button onclick="exportData()">Export local records (JSON)</button></div></section></main><div id="printArea" class="hidden"></div><script>
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), fmt=n=>Number(n).toLocaleString('en-AU',{maximumFractionDigits:2}), day=()=>new Date().toLocaleDateString('en-CA');
const tabs={dashboard:'Dashboard',receiving:'New Receiving',history:'Receiving History',records:'Docket Records',settings:'Settings'};let records=[];try{records=JSON.parse(localStorage.getItem('lyka-demo-v1')||'[]')}catch{}let selected=null,editing=null;
$('nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button id="nav-${k}" onclick="go('${k}')">${v}</button>`).join('');
const fields=[['ref','Delivery Ref No.'],['supplier','Supplier Name'],['staff','Generated By'],['date','Receiving Date','date'],['temp','Temp on Arrival'],['prime','PrimeSafe No.'],['pack','Packaging Acceptable',['PASS','FAIL']],['frozen','Product Hard Frozen',['YES','NO']]];
$('fields').innerHTML=fields.map(([id,label,type])=>`<label>${label}${Array.isArray(type)?`<select id="${id}"><option value="">Select</option>${type.map(x=>`<option>${x}</option>`).join('')}</select>`:`<input id="${id}" type="${type||'text'}">`}</label>`).join('');$('date').value=new Date().toLocaleDateString('sv-SE');
function go(tab){for(const k in tabs){$(k).hidden=k!==tab;$('nav-'+k).classList.toggle('active',k===tab)}$('title').textContent=tabs[tab];$('subtitle').textContent=({dashboard:'Warehouse receiving overview',receiving:'Create and review a delivery',history:'Search previous deliveries',records:'View and print receiving dockets',settings:'Local development settings'})[tab];if(tab==='dashboard')dashboard();if(tab==='history'||tab==='records')listing(tab);if(tab==='receiving')refresh()}
function read(){return Object.fromEntries([...fields.map(f=>f[0]),'raw','notes'].map(k=>[k,$(k).value.trim()]))}
function parse(r){let pallets=[],desc='',errors=[];for(let line of r.raw.split(/\r?\n/)){line=line.trim();if(!line)continue;let match=line.match(/^(.*?)[\s,:]+(\d+(?:\.\d+)?(?:\s*-\s*\d+(?:\.\d+)?)+)$/);if(match){desc=match[1].toUpperCase();line=match[2]}else if(/[a-z]/i.test(line)){desc=line.toUpperCase();continue}for(let part of line.split('-')){part=part.trim();if(!/^\d+(\.\d+)?$/.test(part)||!Number.isFinite(+part)||+part<=0||!desc){errors.push('Invalid weight or missing product: '+line);break}pallets.push({desc,weight:+part})}}let groups=new Map(),total=0;for(const p of pallets){total+=p.weight;if(!groups.has(p.desc))groups.set(p.desc,{count:0,total:0,weights:new Map()});let g=groups.get(p.desc);g.count++;g.total+=p.weight;g.weights.set(p.weight,(g.weights.get(p.weight)||0)+1)}let meta=new Map();for(const l of r.notes.split('\n')){let m=l.match(/(.+?)\s*(?:BBD|USE BY|EXP)\s*:?\s*(\d{1,2}[/.\-]\d{1,2}[/.\-]\d{2,4})/i);if(m)meta.set(m[1].trim().toUpperCase(),[m[2],m[2].replace(/\D/g,'')])}return {pallets,groups,total,meta,errors}}
function metrics(items){return `<div class="metrics">${items.map(([a,b])=>`<div class="metric"><small>${a}</small><strong>${b}</strong></div>`).join('')}</div>`}
function docket(r){let p=parse(r);if(!p.pallets.length)return '<p class="muted">Awaiting valid product weights.</p>';return `<article class="doc"><span class="logo">LYKA</span><h3>RECEIVING DOCKET</h3><p>DELIVERY REF: ${esc(r.ref)}<br>SUPPLIER: ${esc(r.supplier)}<br>GENERATED BY: ${esc(r.staff)}<br>DATE: ${esc(r.date)}</p><p>TEMP: ${esc(r.temp)} · PRIMESAFE: ${esc(r.prime)} · PKG: ${esc(r.pack)} · HARD FROZEN: ${esc(r.frozen)}</p><h3>Pallet Breakdown (Page 1 of 2)</h3><table><thead><tr><th>Pallet</th><th>Product</th><th>BBD</th><th>Batch No.</th><th>Gross kg</th></tr></thead><tbody>${p.pallets.map((x,i)=>{let m=p.meta.get(x.desc)||['N/A','N/A'];return `<tr><td>${i+1}</td><td>${esc(x.desc)}</td><td>${esc(m[0])}</td><td>${esc(m[1])}</td><td>${fmt(x.weight)}</td></tr>`}).join('')}</tbody></table><p>Continued on Page 2…</p></article><article class="doc"><h3>PALLET QUANTITY BREAKDOWN BY WEIGHT</h3><table><tr><th>Product</th><th>Weight per pallet (kg)</th><th>Pallets</th><th>Total kg</th></tr>${[...p.groups].map(([name,g])=>[...g.weights].map(([w,c])=>`<tr><td>${esc(name)}</td><td>${fmt(w)}</td><td>${c}</td><td>${fmt(w*c)}</td></tr>`).join('')+`<tr><td><b>TOTAL ${esc(name)}</b></td><td>—</td><td>${g.count}</td><td>${fmt(g.total)}</td></tr>`).join('')}<tr><th>GRAND TOTAL</th><th>—</th><th>${p.pallets.length}</th><th>${fmt(p.total)}</th></tr></table><h3>Delivery notes</h3><pre>${esc(r.notes||'N/A')}</pre><h3>Manager approval & sign-off</h3><p style="margin-top:40px">Manager name: __________ &nbsp; Signature: __________ &nbsp; Date: __________</p></article>`}
function refresh(){let r=read(),p=parse(r);$('live').innerHTML=metrics([['Total pallets',p.pallets.length],['Gross weight',fmt(p.total)+' kg'],['Products',p.groups.size]]);$('errors').textContent=p.errors.join('; ');$('preview').innerHTML=docket(r)}
$('receiving').addEventListener('input',refresh);$('receiving').addEventListener('change',refresh);
function fill(r){for(let k of [...fields.map(f=>f[0]),'raw','notes'])$(k).value=r[k]||'';refresh()}
function sample(){editing=null;fill({ref:'TOLNHR0001234',supplier:'PARWAN VALLEY MEATS',staff:'DEMO USER',date:new Date().toLocaleDateString('sv-SE'),temp:'-18°C',prime:'PS-10482',pack:'PASS',frozen:'YES',raw:'Kangaroo trim\n952-979.2-979.2-979.2-979.2-979.2-979.2\n\nKangaroo MDM\n432-432-612-612-720-720-720-720',notes:'Kangaroo trim BBD: 30/06/2028\nKangaroo MDM BBD: 25/2/2029'})}
function clearForm(){if(confirm('Clear current form?')){editing=null;fill({date:new Date().toLocaleDateString('sv-SE')})}}
async function copyInput(){try{await navigator.clipboard.writeText($('raw').value);alert('Copied')}catch{alert('Clipboard unavailable. Select and copy the text manually.')}}
function save(){let r=read(),p=parse(r);if(fields.some(([k])=>!r[k])||!p.pallets.length||p.errors.length)return alert('Complete all delivery and quality fields and correct invalid weights.');if(records.some(x=>x.ref.toUpperCase()===r.ref.toUpperCase()&&x.id!==editing))return alert('Delivery reference already exists. Open the existing record from History.');let id=editing||crypto.randomUUID();let next=[...records.filter(x=>x.id!==id),{...r,id,saved:new Date().toISOString()}];try{localStorage.setItem('lyka-demo-v1',JSON.stringify(next));records=next;editing=id;alert('Saved on this device only.')}catch{alert('Unable to save to device storage.')}}
function printRecord(r){if(!parse(r).pallets.length||parse(r).errors.length)return alert('Correct breakdown before printing.');$('printArea').innerHTML=docket(r);$('printArea').classList.remove('hidden');window.print();$('printArea').classList.add('hidden')}
function printCurrent(){printRecord(read())}
function table(rs){return `<div class="scroll"><table><thead><tr><th>Delivery reference</th><th>Date</th><th>Pallets</th><th>Gross kg</th><th>Action</th></tr></thead><tbody>${rs.map(r=>{let p=parse(r);return `<tr><td>${esc(r.ref)}</td><td>${esc(r.date)}</td><td>${p.pallets.length}</td><td>${fmt(p.total)}</td><td><button data-id="${esc(r.id)}" onclick="openRecord(this.dataset.id)">View</button></td></tr>`}).join('')||'<tr><td colspan="5">No saved deliveries</td></tr>'}</tbody></table></div>`}
function dashboard(){let all=records.map(parse),p=all.reduce((a,b)=>a+b.pallets.length,0),w=all.reduce((a,b)=>a+b.total,0),prod=new Map();for(let x of all)for(let [k,g] of x.groups)prod.set(k,(prod.get(k)||0)+g.total);$('dashboard').innerHTML=metrics([['Deliveries',records.length],['Total pallets',p],['Gross weight',fmt(w)+' kg']])+`<div class="actions"><button class="primary" onclick="go('receiving')">+ New receiving</button><button onclick="go('records')">Docket records</button></div><div class="split"><div class="panel"><h3>Receiving activity · last 7 days</h3>${Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let k=d.toLocaleDateString('sv-SE'),n=records.filter(r=>r.date===k).length;return `<p>${k} · ${n} deliveries</p><div class="bar" style="width:${n?100*n/Math.max(1,records.length):0}%"></div>`}).join('')}</div><div class="panel"><h3>Product breakdown</h3>${[...prod].map(([k,v])=>`<p>${esc(k)} · ${fmt(v)} kg</p><div class="bar" style="width:${100*v/Math.max(1,w)}%"></div>`).join('')||'No product data yet.'}</div></div><div class="panel"><h3>Recent receiving</h3>${table([...records].reverse().slice(0,7))}</div>`}
function listing(tab){let el=$(tab);el.innerHTML=`<div class="panel"><input id="search-${tab}" placeholder="Search delivery reference"><div id="list-${tab}"></div></div><div id="detail-${tab}"></div>`;function update(){$('list-'+tab).innerHTML=table([...records].reverse().filter(r=>r.ref.toLowerCase().includes($('search-'+tab).value.toLowerCase())))}$('search-'+tab).oninput=update;update();if(tab==='records'&&selected)showDetail(selected)}
function openRecord(id){selected=records.find(r=>r.id===id);if(!selected)return;go('records');showDetail(selected)}
function showDetail(r){$('detail-records').innerHTML=`<div class="panel"><h3>${esc(r.ref)}</h3><div class="actions"><button onclick="editSelected()">Open receiving entry</button><button onclick="printRecord(selected)">Print / Save PDF</button></div>${docket(r)}</div>`}
function editSelected(){editing=selected.id;go('receiving');fill(selected)}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(records,null,2)],{type:'application/json'}));a.download='lyka-local-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
setInterval(()=>$('clock').textContent=new Date().toLocaleString('en-AU'),1000);go('dashboard');if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></body></html>
